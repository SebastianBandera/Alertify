spring:
  application:
    name: alertify-worker-playwright
  main:
    keep-alive: true
    web-application-type: none
  lifecycle:
    timeout-per-shutdown-phase: 30s

alertify:
  worker:
    name: ${WORKER_NAME:${spring.application.name}}
    grpc-port: ${WORKER_GRPC_PORT:9090}
    max-inbound-message-bytes: ${WORKER_GRPC_MAX_MESSAGE_BYTES:134217728}
    shutdown-grace-period: 10s
    capabilities: ${WORKER_PLAYWRIGHT_CAPABILITIES:PLAYWRIGHT}
    max-concurrent-alerts: ${WORKER_PLAYWRIGHT_MAX_CONCURRENT_ALERTS:2}
    compiler-output-directory: /application/compiled-alerts
    compiler-classpath-directory: /application/compiler-classpath
    tls:
      enabled: ${WORKER_GRPC_TLS_ENABLED:true}
      certificate-chain: /run/alertify-grpc-tls/current/worker-server.crt
      private-key: /run/alertify-grpc-tls/current/worker-server.key
      client-ca-certificate: /run/alertify-grpc-tls/current/backend-client-ca.crt
