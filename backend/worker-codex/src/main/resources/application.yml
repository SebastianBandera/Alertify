spring:
  application:
    name: alertify-worker-codex
  main:
    keep-alive: true
    web-application-type: none
  lifecycle:
    timeout-per-shutdown-phase: 30s

alertify:
  worker:
    name: ${WORKER_NAME:${spring.application.name}}
    grpc-port: ${WORKER_GRPC_PORT:9090}
    max-inbound-message-bytes: ${WORKER_GRPC_MAX_MESSAGE_BYTES:4194304}
    shutdown-grace-period: 10s
    refresh-token-lifetime: ${AI_REFRESH_TOKEN_LIFETIME:30d}
    default-model: ${AI_DEFAULT_MODEL}
    default-reasoning-effort: ${AI_DEFAULT_REASONING_EFFORT}
    default-refresh-policy: ${AI_DEFAULT_REFRESH_POLICY}
    state-file: ${AI_WORKER_STATE_FILE:/application/data/state.enc}
    state-key: ${AI_WORKER_STATE_KEY:}
    tls:
      enabled: ${WORKER_GRPC_TLS_ENABLED:true}
      certificate-chain: /run/alertify-grpc-tls/current/worker-server.crt
      private-key: /run/alertify-grpc-tls/current/worker-server.key
      client-ca-certificate: /run/alertify-grpc-tls/current/backend-client-ca.crt
