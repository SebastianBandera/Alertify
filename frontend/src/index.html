<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Alertify</title>
    <base href="./">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101828">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
  </head>
  <body>
    <app-root>
      <main class="bootstrap-screen" aria-live="polite">
        <img
          class="bootstrap-mark"
          src="icons/alertify.svg"
          width="46"
          height="46"
          alt=""
          aria-hidden="true"
        >
        <div>
          <strong>Alertify</strong>
          <p>Loading...</p>
        </div>
        <span class="bootstrap-spinner" aria-hidden="true"></span>
      </main>
    </app-root>
    <noscript>JavaScript is required to use Alertify.</noscript>
  </body>
</html>
