name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME in .env}

services:
  publisher:
    profiles:
      - local-publisher
    container_name: ${COMPOSE_PROJECT_NAME}-publisher
    build:
      context: ./publisher
      dockerfile: Dockerfile
      args:
        PUBLISHER_BASE_IMAGE: ${FRONTEND_RUNTIME_IMAGE:?Set FRONTEND_RUNTIME_IMAGE in .env}
    image: ${PUBLISHER_IMAGE:?Set PUBLISHER_IMAGE in .env}
    pull_policy: build
    environment:
      NGINX_ENVSUBST_FILTER: ^(PUBLIC_PORT|PUBLISHER_)
      PUBLIC_PORT: ${PUBLIC_PORT:?Set PUBLIC_PORT in .env}
      PUBLISHER_FRONTEND_UPSTREAM: ${PUBLISHER_FRONTEND_UPSTREAM:?Set PUBLISHER_FRONTEND_UPSTREAM in .env}
      PUBLISHER_BACKEND_UPSTREAM: ${PUBLISHER_BACKEND_UPSTREAM:?Set PUBLISHER_BACKEND_UPSTREAM in .env}
      PUBLISHER_IDENTITY_UPSTREAM: ${PUBLISHER_IDENTITY_UPSTREAM:?Set PUBLISHER_IDENTITY_UPSTREAM in .env}
    ports:
      - "${BIND_ADDRESS:?Set BIND_ADDRESS in .env}:${PUBLIC_PORT:?Set PUBLIC_PORT in .env}:8080"
    mem_limit: ${PUBLISHER_CONTAINER_MEMORY:?Set PUBLISHER_CONTAINER_MEMORY in .env}
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --output-document=- http://127.0.0.1:8080/publisher-health | grep -q UP
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  cache:
    profiles:
      - local-cache
    container_name: ${COMPOSE_PROJECT_NAME}-cache
    build:
      context: ./cache
      dockerfile: Dockerfile
      args:
        REDIS_IMAGE: ${REDIS_IMAGE:?Set REDIS_IMAGE in .env}
    image: ${REDIS_LOCAL_IMAGE:?Set REDIS_LOCAL_IMAGE in .env}
    pull_policy: build
    environment:
      REDIS_PASSWORD: ${CACHE_PASSWORD:?Set CACHE_PASSWORD in .env}
      REDIS_MAXMEMORY: ${CACHE_MAX_MEMORY:?Set CACHE_MAX_MEMORY in .env}
    mem_limit: ${CACHE_CONTAINER_MEMORY:?Set CACHE_CONTAINER_MEMORY in .env}
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  identity-database:
    profiles:
      - local-identity-database
    container_name: ${COMPOSE_PROJECT_NAME}-keycloak-database
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE in .env}
    environment:
      POSTGRES_DB: ${IDENTITY_DB_NAME:?Set IDENTITY_DB_NAME in .env}
      POSTGRES_USER: ${IDENTITY_DB_USER:?Set IDENTITY_DB_USER in .env}
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD in .env}
      TZ: ${TIME_ZONE:?Set TIME_ZONE in .env}
    ports:
      - "${BIND_ADDRESS:?Set BIND_ADDRESS in .env}:${IDENTITY_DB_HOST_PORT:?Set IDENTITY_DB_HOST_PORT in .env}:5432"
    volumes:
      - identity_database_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username="$${POSTGRES_USER}" --dbname="$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  identity:
    profiles:
      - local-identity
    container_name: ${COMPOSE_PROJECT_NAME}-keycloak
    build:
      context: ./identity
      dockerfile: Dockerfile
      args:
        KEYCLOAK_IMAGE: ${KEYCLOAK_IMAGE:?Set KEYCLOAK_IMAGE in .env}
    image: ${KEYCLOAK_OPTIMIZED_IMAGE:?Set KEYCLOAK_OPTIMIZED_IMAGE in .env}
    pull_policy: build
    command:
      - start
      - --optimized
      - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${IDENTITY_DB_HOST:?Set IDENTITY_DB_HOST in .env}:${IDENTITY_DB_PORT:?Set IDENTITY_DB_PORT in .env}/${IDENTITY_DB_NAME:?Set IDENTITY_DB_NAME in .env}${IDENTITY_DB_JDBC_PARAMETERS:-}
      KC_DB_USERNAME: ${IDENTITY_DB_USER:?Set IDENTITY_DB_USER in .env}
      KC_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?Set KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?Set KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD in .env}
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set KEYCLOAK_ADMIN_USERNAME in .env}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_RELATIVE_PATH: /identity
      KC_PROXY_HEADERS: xforwarded
      OIDC_REALM: ${OIDC_REALM:?Set OIDC_REALM in .env}
      APP_DISPLAY_NAME: ${APP_DISPLAY_NAME:?Set APP_DISPLAY_NAME in .env}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?Set APP_PUBLIC_URL in .env}
      OIDC_FRONTEND_CLIENT_ID: ${OIDC_FRONTEND_CLIENT_ID:?Set OIDC_FRONTEND_CLIENT_ID in .env}
      OIDC_BACKEND_AUDIENCE: ${OIDC_BACKEND_AUDIENCE:?Set OIDC_BACKEND_AUDIENCE in .env}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:?Set APP_ADMIN_USERNAME in .env}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?Set APP_ADMIN_PASSWORD in .env}
      APP_VIEWER_USERNAME: ${APP_VIEWER_USERNAME:?Set APP_VIEWER_USERNAME in .env}
      APP_VIEWER_PASSWORD: ${APP_VIEWER_PASSWORD:?Set APP_VIEWER_PASSWORD in .env}
    ports:
      - "127.0.0.1:${KEYCLOAK_HTTP_PORT:?Set KEYCLOAK_HTTP_PORT in .env}:8080"
    extra_hosts:
      - host.docker.internal:host-gateway
    post_start:
      - command:
          - /bin/bash
          - /opt/keycloak/config/configure-permanent-admin.sh
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -ec
        - >-
          test -f /tmp/permanent-admin-ready;
          exec 3<>/dev/tcp/127.0.0.1/9000;
          printf 'GET /identity/health/ready HTTP/1.0\r\n\r\n' >&3;
          grep -q '200 OK' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  database:
    profiles:
      - local-database
    container_name: ${COMPOSE_PROJECT_NAME}-database
    build:
      context: ./database
      dockerfile: Dockerfile
      args:
        POSTGRES_IMAGE: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE in .env}
    image: ${DATABASE_IMAGE:?Set DATABASE_IMAGE in .env}
    pull_policy: build
    environment:
      POSTGRES_DB: ${DATABASE_BOOTSTRAP_NAME:?Set DATABASE_BOOTSTRAP_NAME in .env}
      POSTGRES_USER: ${DATABASE_BOOTSTRAP_USER:?Set DATABASE_BOOTSTRAP_USER in .env}
      POSTGRES_PASSWORD: ${DATABASE_BOOTSTRAP_PASSWORD:?Set DATABASE_BOOTSTRAP_PASSWORD in .env}
      DATABASE_NAME: ${DATABASE_NAME:?Set DATABASE_NAME in .env}
      DATABASE_OWNER_USER: ${DATABASE_USER:?Set DATABASE_USER in .env}
      DATABASE_OWNER_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      TZ: ${TIME_ZONE:?Set TIME_ZONE in .env}
    ports:
      - "${BIND_ADDRESS:?Set BIND_ADDRESS in .env}:${DATABASE_HOST_PORT:?Set DATABASE_HOST_PORT in .env}:5432"
    volumes:
      - database_data:/var/lib/postgresql
    mem_limit: ${DATABASE_CONTAINER_MEMORY:?Set DATABASE_CONTAINER_MEMORY in .env}
    restart: unless-stopped

  worker-standard:
    profiles:
      - local-worker-standard
      - local-backend
    build:
      context: ./backend
      dockerfile: worker-standard/Dockerfile
      args:
        BACKEND_BUILD_IMAGE: ${BACKEND_BUILD_IMAGE:?Set BACKEND_BUILD_IMAGE in .env}
        BACKEND_RUNTIME_IMAGE: ${BACKEND_RUNTIME_IMAGE:?Set BACKEND_RUNTIME_IMAGE in .env}
    image: ${WORKER_STANDARD_IMAGE:?Set WORKER_STANDARD_IMAGE in .env}
    pull_policy: build
    environment:
      WORKER_STANDARD_GRPC_PORT: ${WORKER_STANDARD_GRPC_PORT:?Set WORKER_STANDARD_GRPC_PORT in .env}
      TZ: ${TIME_ZONE:?Set TIME_ZONE in .env}
    expose:
      - "${WORKER_STANDARD_GRPC_PORT:?Set WORKER_STANDARD_GRPC_PORT in .env}"
    deploy:
      replicas: ${WORKER_STANDARD_REPLICAS:?Set WORKER_STANDARD_REPLICAS in .env}
    mem_limit: ${WORKER_STANDARD_CONTAINER_MEMORY:?Set WORKER_STANDARD_CONTAINER_MEMORY in .env}
    restart: unless-stopped

  backend:
    profiles:
      - local-backend
    container_name: ${COMPOSE_PROJECT_NAME}-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BACKEND_BUILD_IMAGE: ${BACKEND_BUILD_IMAGE:?Set BACKEND_BUILD_IMAGE in .env}
        BACKEND_RUNTIME_IMAGE: ${BACKEND_RUNTIME_IMAGE:?Set BACKEND_RUNTIME_IMAGE in .env}
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE in .env}
    pull_policy: build
    environment:
      DATABASE_URL: jdbc:postgresql://${DATABASE_HOST:?Set DATABASE_HOST in .env}:${DATABASE_PORT:?Set DATABASE_PORT in .env}/${DATABASE_NAME:?Set DATABASE_NAME in .env}${DATABASE_JDBC_PARAMETERS:-}
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER in .env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      KEY_ENV_PART: ${KEY_ENV_PART:?Set KEY_ENV_PART in .env}
      CONFIGURATION_EXPRESSION_ALLOWED_ENVIRONMENT_VARIABLES: ${CONFIGURATION_EXPRESSION_ALLOWED_ENVIRONMENT_VARIABLES:-}
      ENVIRONMENT_VAR_NAME: ${ENVIRONMENT_VAR_NAME:-}
      REDIS_HOST: ${REDIS_HOST:?Set REDIS_HOST in .env}
      REDIS_PORT: ${REDIS_PORT:?Set REDIS_PORT in .env}
      REDIS_PASSWORD: ${CACHE_PASSWORD:?Set CACHE_PASSWORD in .env}
      REDIS_SSL_ENABLED: ${REDIS_SSL_ENABLED:?Set REDIS_SSL_ENABLED in .env}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:?Set OIDC_ISSUER_URI in .env}
      OIDC_JWK_SET_URI: ${OIDC_JWK_SET_URI:?Set OIDC_JWK_SET_URI in .env}
      OIDC_BACKEND_AUDIENCE: ${OIDC_BACKEND_AUDIENCE:?Set OIDC_BACKEND_AUDIENCE in .env}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?Set APP_PUBLIC_URL in .env}
      JAVA_DEBUG_ENABLED: ${BACKEND_DEBUG_ENABLED:?Set BACKEND_DEBUG_ENABLED in .env}
      JAVA_DEBUG_PORT: ${BACKEND_DEBUG_PORT:?Set BACKEND_DEBUG_PORT in .env}
      JAVA_DEBUG_SUSPEND: ${BACKEND_DEBUG_SUSPEND:?Set BACKEND_DEBUG_SUSPEND in .env}
      WORKER_STANDARD_GRPC_HOST: ${WORKER_STANDARD_GRPC_HOST:?Set WORKER_STANDARD_GRPC_HOST in .env}
      WORKER_STANDARD_GRPC_PORT: ${WORKER_STANDARD_GRPC_PORT:?Set WORKER_STANDARD_GRPC_PORT in .env}
      WORKER_STANDARD_DISCOVERY_ENABLED: ${WORKER_STANDARD_DISCOVERY_ENABLED:?Set WORKER_STANDARD_DISCOVERY_ENABLED in .env}
      WORKER_STANDARD_DISCOVERY_INTERVAL: ${WORKER_STANDARD_DISCOVERY_INTERVAL:?Set WORKER_STANDARD_DISCOVERY_INTERVAL in .env}
      WORKER_STANDARD_HEALTH_TIMEOUT: ${WORKER_STANDARD_HEALTH_TIMEOUT:?Set WORKER_STANDARD_HEALTH_TIMEOUT in .env}
      TZ: ${TIME_ZONE:?Set TIME_ZONE in .env}
    ports:
      - "${BIND_ADDRESS:?Set BIND_ADDRESS in .env}:${BACKEND_DEBUG_PORT:?Set BACKEND_DEBUG_PORT in .env}:${BACKEND_DEBUG_PORT:?Set BACKEND_DEBUG_PORT in .env}"
    mem_limit: ${BACKEND_CONTAINER_MEMORY:?Set BACKEND_CONTAINER_MEMORY in .env}
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --output-document=- http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  frontend:
    profiles:
      - local-frontend
    container_name: ${COMPOSE_PROJECT_NAME}-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        FRONTEND_BUILD_IMAGE: ${FRONTEND_BUILD_IMAGE:?Set FRONTEND_BUILD_IMAGE in .env}
        FRONTEND_RUNTIME_IMAGE: ${FRONTEND_RUNTIME_IMAGE:?Set FRONTEND_RUNTIME_IMAGE in .env}
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE in .env}
    pull_policy: build
    environment:
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:?Set KEYCLOAK_PUBLIC_URL in .env}
      OIDC_REALM: ${OIDC_REALM:?Set OIDC_REALM in .env}
      OIDC_FRONTEND_CLIENT_ID: ${OIDC_FRONTEND_CLIENT_ID:?Set OIDC_FRONTEND_CLIENT_ID in .env}
      OIDC_BACKEND_AUDIENCE: ${OIDC_BACKEND_AUDIENCE:?Set OIDC_BACKEND_AUDIENCE in .env}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:?Set BACKEND_PUBLIC_URL in .env}
      TZ: ${TIME_ZONE:?Set TIME_ZONE in .env}
    mem_limit: ${FRONTEND_CONTAINER_MEMORY:?Set FRONTEND_CONTAINER_MEMORY in .env}
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --output-document=- http://127.0.0.1:8080/health | grep -q UP
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  identity_database_data:
  database_data:
